name: Bug report
description: Report a reproducible Public Edition problem without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, GitHub tokens, private source, private PR links, Context Packs, or raw provider payloads.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python and Git versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic or public reproduction
      description: Include the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private links, source, Context Packs, and provider payloads.
          required: true

