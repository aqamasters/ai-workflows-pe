name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Unit and integration tests
        run: python -m pytest
      - name: Doctor
        run: python -m aqa_ai_workflows_pe.cli doctor

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" build pip-audit
          python -m pip check
      - name: Ruff
        run: |
          python -m ruff check src scripts tests
          python -m ruff format --check src scripts tests
      - name: Runtime boundary
        run: python scripts/verify_no_aqa_endpoint.py
      - name: Architecture boundaries
        run: python scripts/verify_architecture.py
      - name: Documentation links
        run: python scripts/verify_documentation.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock
      - name: Build distributions
        run: python -m build
      - name: Verify wheel contents
        shell: bash
        run: |
          python -m zipfile -l dist/*.whl
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "from importlib.resources import files; assert files('aqa_ai_workflows_pe').joinpath('resources', 'git-askpass').is_file()"
          python -m aqa_ai_workflows_pe.cli export-schemas /tmp/aqa-schemas
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/*
